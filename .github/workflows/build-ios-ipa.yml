name: iOS IPA (EU/PAL retail)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS Device Release IPA
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Verify EU/PAL retail support is present
        run: |
          set -euo pipefail
          grep -q '0x00000806' glue/rexglue-sdk-main/gta4-recomp/src/install/gta4_installer.cpp
          grep -q 'XexRegion::PAL' LibertyRecomp/install/xbox360/xex_validator.h
          git rev-parse HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version
          uname -m

      - name: Prepare pinned dependencies and patches
        run: python3 tools/setup_repo.py

      # Some shared Vulkan translation units are compiled in the iOS target
      # even with Vulkan disabled. Keep their CVar declarations/definitions
      # available in this build tree without modifying tracked submodule files.
      - name: Apply iOS shared Vulkan CVar compatibility
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          header = Path("glue/rexglue-sdk-main/include/rex/graphics/flags.h")
          source = header.read_text()
          marker = "#if REX_HAS_VULKAN\n"
          if marker not in source:
              raise SystemExit("Expected Vulkan feature guard not found in flags.h")
          prefix, suffix = source.split(marker, 1)
          declarations = (
              "REXCVAR_DECLARE(bool, vulkan_dynamic_rendering);\n"
              "REXCVAR_DECLARE(bool, vulkan_transfer_in_draw_pass);\n"
              "REXCVAR_DECLARE(bool, vulkan_require_geometry_shader);\n"
              "REXCVAR_DECLARE(bool, vulkan_require_fill_mode_non_solid);\n"
          )
          for declaration in declarations.splitlines(keepends=True):
              if declaration.strip() not in prefix:
                  prefix += declaration
          header.write_text(prefix + marker + suffix)

          cpp = Path("glue/rexglue-sdk-main/src/graphics/vulkan/command_processor.cpp")
          source = cpp.read_text()
          anchor = '#include <rex/ui/vulkan/util.h>\n'
          if anchor not in source:
              raise SystemExit("Expected command_processor.cpp include anchor not found")
          definitions = (
              '\n// iOS shared-source compatibility: these requirements default off.\n'
              'REXCVAR_DEFINE_BOOL(vulkan_require_geometry_shader, false, "GPU/Vulkan",\n'
              '                    "Require Vulkan geometry shader support");\n'
              'REXCVAR_DEFINE_BOOL(vulkan_require_fill_mode_non_solid, false, "GPU/Vulkan",\n'
              '                    "Require Vulkan non-solid fill mode support");\n'
          )
          if "REXCVAR_DEFINE_BOOL(vulkan_require_geometry_shader" not in source:
              source = source.replace(anchor, anchor + definitions, 1)
          cpp.write_text(source)
          print("Applied shared Vulkan CVar declarations and defaults for the iOS build.")
          PY

      - name: Prepare XeniOS host and iOS shader tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          XENIOS_DIR="$GITHUB_WORKSPACE/../XeniOS"
          git clone --recurse-submodules --branch xenios https://github.com/xenios-jp/XeniOS.git "$XENIOS_DIR"
          cd "$XENIOS_DIR"

          # XeniOS creates xenia-shader-cc as an IMPORTED target after its
          # root-level imported-target configuration pass. Xcode validates
          # every configuration, so give the same native host tool an
          # explicit location for Debug, Checked, and Release.
          python3 - <<'PY'
          from pathlib import Path

          shader_cmake = Path("cmake/ios/ShaderCompiler.cmake")
          source = shader_cmake.read_text()
          old = '''set_target_properties(xenia-shader-cc PROPERTIES
            IMPORTED_LOCATION "${XENIA_IOS_HOST_SHADER_COMPILER}")'''
          new = '''set_target_properties(xenia-shader-cc PROPERTIES
            IMPORTED_CONFIGURATIONS "DEBUG;CHECKED;RELEASE"
            IMPORTED_LOCATION "${XENIA_IOS_HOST_SHADER_COMPILER}"
            IMPORTED_LOCATION_DEBUG "${XENIA_IOS_HOST_SHADER_COMPILER}"
            IMPORTED_LOCATION_CHECKED "${XENIA_IOS_HOST_SHADER_COMPILER}"
            IMPORTED_LOCATION_RELEASE "${XENIA_IOS_HOST_SHADER_COMPILER}")'''
          if old not in source:
              raise SystemExit("Expected xenia-shader-cc imported target block not found")
          shader_cmake.write_text(source.replace(old, new, 1))
          print("Configured xenia-shader-cc for all Xcode configurations.")
          
          # Xcode validates imported targets against every build configuration.
          # XeniOS's iOS third-party setup may only provide Release locations for
          # these host-side tools; map Debug/Checked to the same available binary.
          third_party_cmake = Path("third_party/CMakeLists.txt")
          third_party_source = third_party_cmake.read_text()
          compatibility = r"""
          
          # iOS/Xcode imported-tool configuration compatibility.
          foreach(_xe_tool spirv_to_dxil xenia-third-party-metal-shader-converter)
            if(TARGET ${_xe_tool})
              get_target_property(_xe_tool_location ${_xe_tool} IMPORTED_LOCATION)
              foreach(_xe_config DEBUG CHECKED RELEASE)
                get_target_property(_xe_config_location ${_xe_tool} IMPORTED_LOCATION_${_xe_config})
                if(NOT _xe_config_location)
                  if(_xe_tool_location)
                    set_property(TARGET ${_xe_tool} PROPERTY IMPORTED_LOCATION_${_xe_config} "${_xe_tool_location}")
                  else()
                    get_target_property(_xe_release_location ${_xe_tool} IMPORTED_LOCATION_RELEASE)
                    if(_xe_release_location)
                      set_property(TARGET ${_xe_tool} PROPERTY IMPORTED_LOCATION_${_xe_config} "${_xe_release_location}")
                    endif()
                  endif()
                endif()
              endforeach()
            endif()
          endforeach()
          """
          if "iOS/Xcode imported-tool configuration compatibility." not in third_party_source:
              third_party_cmake.write_text(third_party_source + compatibility)

          PY

          # XeniOS's iOS configure requires a native macOS xenia-shader-cc
          # built from the same source revision, plus Apple's iPhoneOS MSC dylib.
          cd "$XENIOS_DIR"
          # XeniOS's Vulkan CMake configure also requires the pinned host slangc compiler.
          ./xenia-build.py slang
          ./xenia-build.py msc
          python3 -m pip install --upgrade meson mako pyyaml packaging

          # XeniOS keeps controller mappings, game patches, and compatibility
          # metadata in build/data_repos; recursive submodule checkout does not
          # populate these separately maintained repositories.
          python3 xenia-build.py fetchdata

          DATA_REPOS_DIR="$XENIOS_DIR/build/data_repos"
          test -s "$DATA_REPOS_DIR/SDL_GameControllerDB/gamecontrollerdb.txt" || {
            echo "::error::Missing XeniOS SDL controller database after fetchdata"
            exit 1
          }
          test -d "$DATA_REPOS_DIR/game-patches/patches" || {
            echo "::error::Missing XeniOS game-patches/patches after fetchdata"
            exit 1
          }
          test -s "$DATA_REPOS_DIR/game-compatibility/compatibility_data.json" || {
            echo "::error::Missing XeniOS compatibility_data.json after fetchdata"
            exit 1
          }
          test -s "$DATA_REPOS_DIR/x360db/games.json" || {
            echo "::error::Missing XeniOS x360db/games.json after fetchdata"
            exit 1
          }
          echo "Verified XeniOS bundled data repositories:"
          ls -ld "$DATA_REPOS_DIR/SDL_GameControllerDB" "$DATA_REPOS_DIR/game-patches/patches" "$DATA_REPOS_DIR/game-compatibility" "$DATA_REPOS_DIR/x360db"

          cmake -S . -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host --target xenia-shader-cc --parallel 6
          HOST_SHADER_COMPILER="$(find build-host -type f -name xenia-shader-cc -perm -u+x -print -quit)"
          if [[ -z "$HOST_SHADER_COMPILER" ]]; then
            echo "::error::XeniOS native xenia-shader-cc was not built"
            exit 1
          fi
          echo "XENIA_IOS_HOST_SHADER_COMPILER=$XENIOS_DIR/$HOST_SHADER_COMPILER" >> "$GITHUB_ENV"

          MSC_IOS_DIR="$RUNNER_TEMP/msc-ios"
          mkdir -p "$MSC_IOS_DIR"
          gh release download ios-4.0.3 --repo xenios-jp/metal-shader-converter \
            --pattern libmetalirconverter.dylib --dir "$MSC_IOS_DIR" --clobber
          MSC_IOS_LIBRARY="$MSC_IOS_DIR/libmetalirconverter.dylib"
          echo "bd6b729dcbde133a511d95130eb4d287a1e18b4170453f8b350e78a20bfc37aa  $MSC_IOS_LIBRARY" | shasum -a 256 -c -
          codesign --verify --strict "$MSC_IOS_LIBRARY"
          xcrun vtool -show-build "$MSC_IOS_LIBRARY" | grep "platform IOS"
          echo "XENIA_IOS_SHADER_CONVERTER_LIBRARY=$MSC_IOS_LIBRARY" >> "$GITHUB_ENV"

      - name: Build XeniOS iOS MoltenVK dependency archives
        run: |
          set -euo pipefail
          XENIOS_DIR="$GITHUB_WORKSPACE/../XeniOS"
          cmake -S "$XENIOS_DIR" -B "$XENIOS_DIR/build-ios-xcode" -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DXENIA_IOS_HOST_SHADER_COMPILER="$XENIA_IOS_HOST_SHADER_COMPILER" \
            -DXENIA_IOS_SHADER_CONVERTER_LIBRARY="$XENIA_IOS_SHADER_CONVERTER_LIBRARY" \
            -DXENIA_IOS_COMPATIBILITY_DATA_DIR="$XENIOS_DIR/build/data_repos/game-compatibility"
          # XeniOS deliberately excludes its macOS-only MoltenVK archive targets
          # when XE_PLATFORM_IOS is enabled. Build only the shared Apple targets
          # that actually exist in the iOS Xcode project.
          cmake --build "$XENIOS_DIR/build-ios-xcode" --config Release \
            --target spirv-cross SPIRV-Tools-static --parallel 6

      - name: Configure iOS Device Release
        run: |
          cmake --preset ios-device-release \
            -DTHEFT4_BUILD_GAME_CODE=ON \
            -DTHEFT4_ENABLE_GAME_STARTUP=ON \
            -DTHEFT4_ENABLE_GTA4_NATIVE_BACKEND=ON \
            -DREXGLUE_RUNTIME_ONLY=ON \
            -DREXGLUE_HEADLESS_KERNEL=ON \
            -DTHEFT4_XENIOS_IOS_LIB_DIR="$GITHUB_WORKSPACE/../XeniOS/build-ios-xcode/obj/iOS/Release"

      - name: Build Theft4 with the native GTA IV renderer
        run: cmake --build --preset theft4-device-release --parallel 3

      - name: Package unsigned IPA
        id: package
        run: |
          set -euo pipefail
          BUILD_DIR="out/build/ios-device-release"
          APP_PATH="$(find "$BUILD_DIR" -type d -name "Theft4.app" -print -quit)"

          if [[ -z "$APP_PATH" || ! -d "$APP_PATH" ]]; then
            echo "::error::Theft4.app was not produced"
            find "$BUILD_DIR" -maxdepth 5 -type d -name "*.app" -print || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/Theft4.app"

          IPA_NAME="Theft4-iOS-${{ github.sha }}.ipa"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/$IPA_NAME"

          echo "artifact_path=$RUNNER_TEMP/$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$RUNNER_TEMP/$IPA_NAME"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Xcode build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-build-logs-${{ github.run_id }}
          path: |
            out/build/ios-device-release/CMakeFiles/CMakeOutput.log
            out/build/ios-device-release/CMakeFiles/CMakeError.log
            out/build/ios-device-release/CMakeCache.txt
            out/build/ios-device-release/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
