name: iOS IPA (EU/PAL retail)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS Device Release IPA
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Verify EU/PAL retail support is present
        run: |
          set -euo pipefail
          grep -q '0x00000806' glue/rexglue-sdk-main/gta4-recomp/src/install/gta4_installer.cpp
          grep -q 'XexRegion::PAL' LibertyRecomp/install/xbox360/xex_validator.h
          git rev-parse HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version
          uname -m

      - name: Prepare pinned dependencies and patches
        run: python3 tools/setup_repo.py

      # The iOS build compiles the shared Vulkan render-target source even when
      # the optional Vulkan backend is disabled. flags.cpp defines this shared
      # CVar unconditionally, so expose its declaration outside REX_HAS_VULKAN.
      - name: Make shared Vulkan CVar visible to the iOS build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("glue/rexglue-sdk-main/include/rex/graphics/flags.h")
          source = path.read_text()
          old = """#if REX_HAS_VULKAN
          REXCVAR_DECLARE(bool, vulkan_sparse_shared_memory);
          REXCVAR_DECLARE(bool, vulkan_submit_on_primary_buffer_end);
          REXCVAR_DECLARE(bool, vulkan_dynamic_rendering);"""
          new = """REXCVAR_DECLARE(bool, vulkan_dynamic_rendering);

          #if REX_HAS_VULKAN
          REXCVAR_DECLARE(bool, vulkan_sparse_shared_memory);
          REXCVAR_DECLARE(bool, vulkan_submit_on_primary_buffer_end);"""
          if old not in source:
              if "REXCVAR_DECLARE(bool, vulkan_dynamic_rendering);" in source and not source.split("REXCVAR_DECLARE(bool, vulkan_dynamic_rendering);", 1)[0].rstrip().endswith("#if REX_HAS_VULKAN"):
                  raise SystemExit("Vulkan CVar declaration already appears to be fixed; inspect flags.h")
              raise SystemExit("Expected Vulkan CVar declaration block not found; refusing blind edit")
          path.write_text(source.replace(old, new, 1))
          print("Exposed vulkan_dynamic_rendering declaration for the iOS shared-source build.")
          PY

      - name: Build vendored MoltenVK for iOS
        run: |
          set -euo pipefail
          cd thirdparty/MoltenVK/MoltenVK
          ./fetchDependencies --ios
          make ios

      - name: Configure iOS Device Release
        run: |
          cmake --preset ios-device-release \
            -DTHEFT4_BUILD_GAME_CODE=ON \
            -DTHEFT4_ENABLE_GAME_STARTUP=ON \
            -DTHEFT4_ENABLE_GTA4_NATIVE_BACKEND=ON \
            -DREXGLUE_RUNTIME_ONLY=ON \
            -DREXGLUE_HEADLESS_KERNEL=ON \
            -DTHEFT4_MOLTENVK_IOS_LIB_DIR="$GITHUB_WORKSPACE/thirdparty/MoltenVK/MoltenVK/Package/Release/MoltenVK/static/MoltenVK.xcframework/ios-arm64"

      - name: Build Theft4 with the native GTA IV renderer
        run: cmake --build --preset theft4-device-release --parallel 3

      - name: Package unsigned IPA
        id: package
        run: |
          set -euo pipefail
          BUILD_DIR="out/build/ios-device-release"
          APP_PATH="$(find "$BUILD_DIR" -type d -name "Theft4.app" -print -quit)"

          if [[ -z "$APP_PATH" || ! -d "$APP_PATH" ]]; then
            echo "::error::Theft4.app was not produced"
            find "$BUILD_DIR" -maxdepth 5 -type d -name "*.app" -print || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/Theft4.app"

          IPA_NAME="Theft4-iOS-${{ github.sha }}.ipa"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/$IPA_NAME"

          echo "artifact_path=$RUNNER_TEMP/$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$RUNNER_TEMP/$IPA_NAME"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Xcode build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-build-logs-${{ github.run_id }}
          path: |
            out/build/ios-device-release/CMakeFiles/CMakeOutput.log
            out/build/ios-device-release/CMakeFiles/CMakeError.log
            out/build/ios-device-release/CMakeCache.txt
            out/build/ios-device-release/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
